# Squid с TLS на соединении клиент -> прокси.
# Сертификат должен содержать имя, по которому клиенты открывают прокси.

https_port 3129 tls-cert=/etc/squid/tls/proxy.crt tls-key=/etc/squid/tls/proxy.key
visible_hostname tls-proxy

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm Private proxy
auth_param basic credentialsttl 2 hours

acl authenticated proxy_auth REQUIRED
acl manager proto cache_object
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

http_access deny manager
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow authenticated
http_access deny all

# Не сохранять ответы ни на диск, ни в объектный кеш в памяти.
# В конфигурации намеренно нет cache_dir.
cache deny all

# Не записывать HTTP-запросы и операции объектного кеша.
access_log none
cache_store_log none

# Не вести административный файловый журнал Squid.
# Ошибки запуска по-прежнему доступны через systemd journal.
cache_log /dev/null
