# Native VictoriaMetrics Operator scrape definitions for YDB.
# Equivalent coverage to:
#   https://github.com/ydb-platform/ydb/tree/main/ydb/deploy/prometheus
#
# Apply together with vmagent.yaml (or any VMAgent/VMSingle that selects these objects).
# Edit targets in each targetEndpoints[].targets before use.
#
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: ydb-auth
  labels:
    app.kubernetes.io/name: ydb
    app.kubernetes.io/component: metrics-scrape
    ydb.tech/counter: auth
spec:
  jobName: ydb/auth
  targetEndpoints:
  - targets:
    - ydb-s1.example.com:8765
    - ydb-s2.example.com:8765
    - ydb-s3.example.com:8765
    labels:
      container: ydb-static
      counter: auth
    path: /counters/counters=auth/prometheus
    scheme: https
    scrape_interval: 15s
    scrapeTimeout: 15s
    max_scrape_size: 64MB
    tlsConfig:
      insecureSkipVerify: true
    vm_scrape_params:
      stream_parse: true
    relabelConfigs:
    - sourceLabels:
      - __address__
      targetLabel: instance
      regex: ([^:]+)(:[0-9]+)?
      replacement: ${1}
    metricRelabelConfigs:
    - sourceLabels:
      - __name__
      targetLabel: __name__
      replacement: auth_$1
  - targets:
    - ydb-s1.example.com:31002
    - ydb-s1.example.com:31012
    - ydb-s1.example.com:31022
    - ydb-s2.example.com:31002
    - ydb-s2.example.com:31012
    - ydb-s2.example.com:31022
    - ydb-s3.example.com:31002
    - ydb-s3.example.com:31012
    - ydb-s3.example.com:31022
    labels:
      container: ydb-dynamic
      counter: auth
    path: /counters/counters=auth/prometheus
    scheme: https
    scrape_interval: 15s
    scrapeTimeout: 15s
    max_scrape_size: 64MB
    tlsConfig:
      insecureSkipVerify: true
    vm_scrape_params:
      stream_parse: true
    relabelConfigs:
    - sourceLabels:
      - __address__
      targetLabel: instance
      regex: ([^:]+)(:[0-9]+)?
      replacement: ${1}
    metricRelabelConfigs:
    - sourceLabels:
      - __name__
      targetLabel: __name__
      replacement: auth_$1
---
