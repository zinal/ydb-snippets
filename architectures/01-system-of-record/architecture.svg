<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Arial, sans-serif">
<title id="title">System of Record на YDB</title>
<desc id="desc">API записывает каноническое состояние одной ACID-транзакцией. CDC exactly-once помещает change record во внутренний changefeed topic и сохраняет порядок по полному первичному ключу; чтение consumer после сбоя может повториться.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
<marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
<marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
<style>
text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #172033; }
.heading { font-size: 34px; font-weight: 700; } .subtitle { font-size: 17px; fill: #526176; }
.boundary-label { font-size: 20px; font-weight: 700; fill: #334155; }
.box-title { font-size: 17px; font-weight: 700; } .box-text { font-size: 14px; } .small { font-size: 12.5px; fill: #475569; }
.flow { font-size: 13px; font-weight: 700; fill: #334155; }
.arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
.async { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowPurple); }
.queue-flow { fill: none; stroke: #ea580c; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowOrange); }
</style></defs>
<rect width="1600" height="1000" fill="#f8fafc"/>
<text x="55" y="58" class="heading" text-anchor="start"><tspan x="55" dy="0">System of Record на YDB</tspan></text>
<text x="55" y="88" class="subtitle" text-anchor="start"><tspan x="55" dy="0">Источник истины — строковые таблицы; события и downstream-проекции являются производными</tspan></text>
<rect x="290" y="125" width="925" height="650" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="10 7"/>
<rect x="318" y="108" width="205" height="34" rx="17" fill="#e2e8f0"/>
<text x="340" y="132" class="boundary-label" text-anchor="start"><tspan x="340" dy="0">Граница YDB</tspan></text>
<g><rect x="40" y="240" width="215" height="175" rx="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="65" y="276" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="65" dy="0">API / доменный сервис</tspan></text><text x="65" y="303" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="65" dy="0">Команды и версии</tspan></text><text x="65" y="327" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="65" dy="0">Идемпотентность</tspan></text></g>
<g><rect x="340" y="170" width="300" height="130" rx="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="365" y="206" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="365" dy="0">Доменная логика</tspan></text><text x="365" y="233" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="365" dy="0">Проверка инвариантов</tspan></text><text x="365" y="257" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="365" dy="0">Запись и чтение</tspan></text></g>
<rect x="320" y="330" width="580" height="405" rx="20" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="480" y="317" width="260" height="28" rx="14" fill="#fee2e2"/>
<text x="610" y="337" class="small" text-anchor="middle" style="fill:#b91c1c"><tspan x="610" dy="0">ACID: сущность + аудит + idempotency</tspan></text>
<g><rect x="340" y="350" width="540" height="365" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/><rect x="340" y="350" width="540" height="50" rx="16" fill="#16a34a"/><path d="M340 385 H880 V400 H340 Z" fill="#16a34a"/><text x="367" y="383" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="367" dy="0">Строковые таблицы YDB</tspan></text><rect x="365" y="418" width="490" height="51" rx="8" fill="#ffffff" stroke="#86efac"/><text x="383" y="440" class="box-title" text-anchor="start"><tspan x="383" dy="0">Entities</tspan></text><text x="590" y="440" class="small" text-anchor="start"><tspan x="590" dy="0">PK: entity_id</tspan></text><rect x="365" y="476" width="490" height="51" rx="8" fill="#ffffff" stroke="#86efac"/><text x="383" y="498" class="box-title" text-anchor="start"><tspan x="383" dy="0">Relations</tspan></text><text x="590" y="498" class="small" text-anchor="start"><tspan x="590" dy="0">source_hash, type, target_id</tspan></text><rect x="365" y="534" width="490" height="51" rx="8" fill="#ffffff" stroke="#86efac"/><text x="383" y="556" class="box-title" text-anchor="start"><tspan x="383" dy="0">IdempotencyKeys</tspan></text><text x="590" y="556" class="small" text-anchor="start"><tspan x="590" dy="0">PK: scope_hash, key</tspan></text><rect x="365" y="592" width="490" height="51" rx="8" fill="#ffffff" stroke="#86efac"/><text x="383" y="614" class="box-title" text-anchor="start"><tspan x="383" dy="0">AuditLog</tspan></text><text x="590" y="614" class="small" text-anchor="start"><tspan x="590" dy="0">PK: entity_hash, version</tspan></text><rect x="365" y="650" width="490" height="51" rx="8" fill="#ffffff" stroke="#86efac"/><text x="383" y="672" class="box-title" text-anchor="start"><tspan x="383" dy="0">Источник истины</tspan></text><text x="590" y="672" class="small" text-anchor="start"><tspan x="590" dy="0">Только подтвержденные строки</tspan></text></g>
<g><rect x="950" y="185" width="215" height="115" rx="15" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="975" y="221" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">CDC → internal topic</tspan></text><text x="975" y="248" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Exactly-once change record</tspan></text><text x="975" y="272" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Порядок: полный PK</tspan></text></g>
<g><rect x="950" y="365" width="215" height="120" rx="15" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="975" y="401" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Внутренний topic</tspan></text><text x="975" y="428" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">changefeed topics</tspan></text><text x="975" y="455" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Consumer retry возможен</tspan></text></g>
<g><rect x="950" y="585" width="215" height="125" rx="15" fill="#0f9f9a" stroke="#0f9f9a" stroke-width="2"/><text x="975" y="621" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Coordination Service</tspan></text><text x="975" y="648" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Lease: singleton maintenance</tspan></text><text x="975" y="672" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Не заменяет ACID</tspan></text></g>
<path d="M255 280 H340" class="arrow" marker-end="url(#arrow)"/>
<text x="270" y="263" class="flow" text-anchor="start"><tspan x="270" dy="0">команда записи</tspan></text>
<path d="M340 620 H290 V380 H255" class="arrow" marker-end="url(#arrow)"/>
<text x="265" y="605" class="flow" text-anchor="start"><tspan x="265" dy="0">чтение</tspan></text>
<path d="M490 300 V330" class="arrow" marker-end="url(#arrow)"/>
<text x="505" y="322" class="flow" text-anchor="start"><tspan x="505" dy="0">ACID commit</tspan></text>
<path d="M900 455 H925 V243 H950" class="async" marker-end="url(#arrowPurple)"/>
<text x="908" y="228" class="flow" text-anchor="start"><tspan x="908" dy="0">после commit</tspan></text>
<path d="M1057 300 V365" class="async" marker-end="url(#arrowPurple)"/>
<text x="1072" y="338" class="flow" text-anchor="start"><tspan x="1072" dy="0">publish</tspan></text>
<path d="M950 647 H900" class="arrow" marker-end="url(#arrow)"/>
<text x="905" y="632" class="flow" text-anchor="start"><tspan x="905" dy="0">обслуживание</tspan></text>
<g><rect x="1285" y="180" width="265" height="105" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1310" y="216" class="box-title" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">Индексатор поиска</tspan></text><text x="1310" y="243" class="box-text" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">group: search-index</tspan></text><text x="1310" y="267" class="box-text" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">Идемпотентно по event_id</tspan></text></g>
<g><rect x="1285" y="325" width="265" height="105" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1310" y="361" class="box-title" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">Обновление кэша</tspan></text><text x="1310" y="388" class="box-text" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">group: cache</tspan></text><text x="1310" y="412" class="box-text" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">Версия не убывает</tspan></text></g>
<g><rect x="1285" y="470" width="265" height="105" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1310" y="506" class="box-title" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">Интеграционный consumer</tspan></text><text x="1310" y="533" class="box-text" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">group: integration</tspan></text><text x="1310" y="557" class="box-text" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">Side effect идемпотентен</tspan></text></g>
<path d="M1165 410 H1225 V232 H1285" class="async" marker-end="url(#arrowPurple)"/>
<path d="M1165 438 H1243 V377 H1285" class="async" marker-end="url(#arrowPurple)"/>
<path d="M1165 466 H1261 V522 H1285" class="async" marker-end="url(#arrowPurple)"/>
<text x="1180" y="395" class="flow" text-anchor="start"><tspan x="1180" dy="0">consumer groups</tspan></text>
<g><rect x="1285" y="610" width="265" height="120" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1310" y="646" class="box-title" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">Важное ограничение</tspan></text><text x="1310" y="673" class="box-text" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">Топик и кэш не являются</tspan></text><text x="1310" y="697" class="box-text" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">источником истины</tspan></text></g>
<rect x="40" y="805" width="1510" height="72" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
<text x="68" y="835" class="box-title" text-anchor="start"><tspan x="68" dy="0">Гарантии</tspan></text>
<text x="180" y="835" class="box-text" text-anchor="start"><tspan x="180" dy="0">CDC: exactly-once change record · порядок для полного первичного ключа</tspan><tspan x="180" dy="25">Consumer retry возможен · обработка идемпотентна · maintenance повторяем</tspan></text>
<text x="55" y="928" class="boundary-label" text-anchor="start"><tspan x="55" dy="0">Легенда</tspan></text>
<rect x="175" y="906" width="32" height="23" rx="5" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="217" y="924" class="box-text" text-anchor="start"><tspan x="217" dy="0">приложение</tspan></text>
<rect x="365" y="906" width="32" height="23" rx="5" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="407" y="924" class="box-text" text-anchor="start"><tspan x="407" dy="0">строковая таблица</tspan></text>
<rect x="600" y="906" width="32" height="23" rx="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
<text x="642" y="924" class="box-text" text-anchor="start"><tspan x="642" dy="0">топик / CDC</tspan></text>
<rect x="790" y="906" width="32" height="23" rx="5" fill="#f97316" stroke="#f97316" stroke-width="2"/>
<text x="832" y="924" class="box-text" text-anchor="start"><tspan x="832" dy="0">очередь</tspan></text>
<rect x="940" y="906" width="32" height="23" rx="5" fill="#0f9f9a" stroke="#0f9f9a" stroke-width="2"/>
<text x="982" y="924" class="box-text" text-anchor="start"><tspan x="982" dy="0">Coordination</tspan></text>
<rect x="1135" y="906" width="32" height="23" rx="5" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
<text x="1177" y="924" class="box-text" text-anchor="start"><tspan x="1177" dy="0">ошибка / DLQ</tspan></text>
<line x1="1355" y1="917" x2="1410" y2="917" class="async" marker-end="url(#arrowPurple)"/>
<text x="1420" y="924" class="box-text" text-anchor="start"><tspan x="1420" dy="0">асинхронно</tspan></text>
