<g><rect x="910" y="205" width="280" height="135" rx="14" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="930" y="236" class="box-title" text-anchor="start" style="fill:#ffffff;font-size:17px"><tspan x="930" dy="0">CDC</tspan></text><text x="930" y="263" class="body" text-anchor="start" style="fill:#ffffff;font-size:12px"><tspan x="930" dy="0">Одна change record на</tspan></text><text x="930" y="285" class="body" text-anchor="start" style="fill:#ffffff;font-size:12px"><tspan x="930" dy="0">committed-изменение строки</tspan></text><text x="930" y="307" class="body" text-anchor="start" style="fill:#ffffff;font-size:12px"><tspan x="930" dy="0">Порядок: полный PK</tspan></text></g>
<g><rect x="910" y="390" width="280" height="130" rx="14" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="930" y="421" class="box-title" text-anchor="start" style="fill:#ffffff;font-size:17px"><tspan x="930" dy="0">Internal changefeed Topics</tspan></text><text x="930" y="448" class="body" text-anchor="start" style="fill:#ffffff;font-size:12px"><tspan x="930" dy="0">Entities / Relations</tspan></text><text x="930" y="470" class="body" text-anchor="start" style="fill:#ffffff;font-size:12px"><tspan x="930" dy="0">Offset: YDB Consumer</tspan></text><text x="930" y="492" class="body" text-anchor="start" style="fill:#ffffff;font-size:12px"><tspan x="930" dy="0">по партициям</tspan></text></g>
<g><rect x="910" y="600" width="280" height="105" rx="14" fill="#0f9f9a" stroke="#0f9f9a" stroke-width="2"/><text x="930" y="631" class="box-title" text-anchor="start" style="fill:#ffffff;font-size:17px"><tspan x="930" dy="0">Coordination Service</tspan></text><text x="930" y="658" class="body" text-anchor="start" style="fill:#ffffff;font-size:12px"><tspan x="930" dy="0">Lease, не ACID</tspan></text><text x="930" y="680" class="body" text-anchor="start" style="fill:#ffffff;font-size:12px"><tspan x="930" dy="0">Только координация</tspan></text></g>
<g><rect x="1270" y="180" width="290" height="120" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1290" y="211" class="box-title" text-anchor="start" style="fill:#172033;font-size:17px"><tspan x="1290" dy="0">Search projector</tspan></text><text x="1290" y="238" class="body" text-anchor="start" style="fill:#172033;font-size:12px"><tspan x="1290" dy="0">YDB Consumer search-index</tspan></text><text x="1290" y="260" class="body" text-anchor="start" style="fill:#172033;font-size:12px"><tspan x="1290" dy="0">Повтор обработки безопасен</tspan></text></g>
