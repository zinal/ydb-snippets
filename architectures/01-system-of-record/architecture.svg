<rect x="390" y="444" width="460" height="82" rx="8" fill="#ffffff" stroke="#86efac"/><text x="405" y="469" class="box-title" text-anchor="start" style="font-size:15px"><tspan x="405" dy="0">IdempotencyKeys</tspan></text><text x="405" y="492" class="small" text-anchor="start" style="font-size:10.5px"><tspan x="405" dy="0">PK: (scope_hash, scope,</tspan><tspan x="405" dy="16">idempotency_key)</tspan></text>
