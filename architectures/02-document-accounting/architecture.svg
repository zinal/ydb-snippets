<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Arial, sans-serif">
<title id="title">Документная учетная система на YDB</title>
<desc id="desc">Posting service атомарно проводит документ, изменяет регистры и добавляет строку PostingEvents. CDC exactly-once пишет ее change record во внутренний topic с порядком по полному PK; consumer создает задания YMQ идемпотентно.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
<marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
<marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
<style>
text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #172033; }
.heading { font-size: 34px; font-weight: 700; } .subtitle { font-size: 17px; fill: #526176; }
.boundary-label { font-size: 20px; font-weight: 700; fill: #334155; }
.box-title { font-size: 17px; font-weight: 700; } .box-text { font-size: 14px; } .small { font-size: 12.5px; fill: #475569; }
.flow { font-size: 13px; font-weight: 700; fill: #334155; }
.arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
.async { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowPurple); }
.queue-flow { fill: none; stroke: #ea580c; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowOrange); }
</style></defs>
<rect width="1600" height="1000" fill="#f8fafc"/>
<text x="55" y="58" class="heading" text-anchor="start"><tspan x="55" dy="0">Документная учетная система на YDB</tspan></text>
<text x="55" y="88" class="subtitle" text-anchor="start"><tspan x="55" dy="0">Черновик → проведение → отмена; движения и остатки фиксируются атомарно</tspan></text>
<rect x="290" y="125" width="925" height="650" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="10 7"/>
<rect x="318" y="108" width="205" height="34" rx="17" fill="#e2e8f0"/>
<text x="340" y="132" class="boundary-label" text-anchor="start"><tspan x="340" dy="0">Граница YDB</tspan></text>
<g><rect x="40" y="240" width="215" height="175" rx="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="65" y="276" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="65" dy="0">Document API</tspan></text><text x="65" y="303" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="65" dy="0">Черновик / провести</tspan></text><text x="65" y="327" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="65" dy="0">Отменить / operation_id</tspan></text></g>
<g><rect x="340" y="170" width="300" height="130" rx="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="365" y="206" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="365" dy="0">Posting service</tspan></text><text x="365" y="233" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="365" dy="0">Статус и версия</tspan></text><text x="365" y="257" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="365" dy="0">Расчет движений</tspan></text></g>
<rect x="320" y="330" width="580" height="405" rx="20" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="480" y="317" width="260" height="28" rx="14" fill="#fee2e2"/>
<text x="610" y="337" class="small" text-anchor="middle" style="fill:#b91c1c"><tspan x="610" dy="0">ACID: + PostingEvents row</tspan></text>
<g><rect x="340" y="350" width="540" height="365" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/><rect x="340" y="350" width="540" height="50" rx="16" fill="#16a34a"/><path d="M340 385 H880 V400 H340 Z" fill="#16a34a"/><text x="367" y="383" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="367" dy="0">Строковые таблицы YDB</tspan></text><rect x="365" y="418" width="235" height="72" rx="8" fill="#ffffff" stroke="#86efac"/><text x="381" y="445" class="box-title"><tspan x="381" dy="0">Documents</tspan></text><text x="381" y="470" class="small"><tspan x="381" dy="0">tenant_hash, document_id</tspan></text><rect x="620" y="418" width="235" height="72" rx="8" fill="#ffffff" stroke="#86efac"/><text x="636" y="445" class="box-title"><tspan x="636" dy="0">DocumentLines</tspan></text><text x="636" y="470" class="small"><tspan x="636" dy="0">document_id, line_no</tspan></text><rect x="365" y="508" width="235" height="72" rx="8" fill="#ffffff" stroke="#86efac"/><text x="381" y="535" class="box-title"><tspan x="381" dy="0">Registers</tspan></text><text x="381" y="560" class="small"><tspan x="381" dy="0">dimension_hash, bucket</tspan></text><rect x="620" y="508" width="235" height="72" rx="8" fill="#ffffff" stroke="#86efac"/><text x="636" y="535" class="box-title"><tspan x="636" dy="0">Balances</tspan></text><text x="636" y="560" class="small"><tspan x="636" dy="0">register_id, dimension_hash</tspan></text><rect x="365" y="598" width="235" height="72" rx="8" fill="#ffffff" stroke="#86efac"/><text x="381" y="625" class="box-title"><tspan x="381" dy="0">PostingAttempts</tspan></text><text x="381" y="650" class="small"><tspan x="381" dy="0">document_id, operation_id</tspan></text><rect x="620" y="598" width="235" height="72" rx="8" fill="#ffffff" stroke="#86efac"/><text x="636" y="625" class="box-title"><tspan x="636" dy="0">PostingEvents</tspan></text><text x="636" y="650" class="small" style="font-size:10.5px"><tspan x="636" dy="0">(tenant_hash, document_id, event_seq)</tspan></text></g>
<g><rect x="950" y="185" width="215" height="115" rx="15" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="975" y="221" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">CDC PostingEvents</tspan></text><text x="975" y="248" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Exactly-once record</tspan></text><text x="975" y="272" class="box-text" text-anchor="start" style="fill:#ffffff;font-size:10.5px"><tspan x="975" dy="0">(tenant_hash, document_id, event_seq)</tspan></text></g>
<g><rect x="950" y="365" width="215" height="120" rx="15" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="975" y="401" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Внутренний topic</tspan></text><text x="975" y="428" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">PostingEvents CF</tspan></text><text x="975" y="455" class="box-text" text-anchor="start" style="fill:#ffffff;font-size:10.5px"><tspan x="975" dy="0">(tenant_hash, document_id, event_seq)</tspan></text></g>
<g><rect x="950" y="585" width="215" height="125" rx="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="975" y="621" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Reconciliation worker</tspan></text><text x="975" y="648" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Документы ↔ движения</tspan></text><text x="975" y="672" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Движения ↔ остатки</tspan></text></g>
<path d="M255 280 H340" class="arrow" marker-end="url(#arrow)"/>
<text x="270" y="263" class="flow" text-anchor="start"><tspan x="270" dy="0">команда записи</tspan></text>
<path d="M340 620 H290 V380 H255" class="arrow" marker-end="url(#arrow)"/>
<text x="265" y="605" class="flow" text-anchor="start"><tspan x="265" dy="0">чтение</tspan></text>
<path d="M490 300 V330" class="arrow" marker-end="url(#arrow)"/>
<text x="505" y="322" class="flow" text-anchor="start"><tspan x="505" dy="0">ACID commit</tspan></text>
<path d="M900 455 H925 V243 H950" class="async" marker-end="url(#arrowPurple)"/>
<text x="908" y="228" class="flow" text-anchor="start"><tspan x="908" dy="0">после commit</tspan></text>
<path d="M1057 300 V365" class="async" marker-end="url(#arrowPurple)"/>
<text x="1072" y="338" class="flow" text-anchor="start"><tspan x="1072" dy="0">publish</tspan></text>
<path d="M950 647 H900" class="arrow" marker-end="url(#arrow)"/>
<text x="905" y="632" class="flow" text-anchor="start"><tspan x="905" dy="0">сверка чтением</tspan></text>
<g><rect x="1285" y="190" width="265" height="125" rx="15" fill="#f97316" stroke="#f97316" stroke-width="2"/><text x="1310" y="226" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="1310" dy="0">YMQ / SQS-очередь</tspan></text><text x="1310" y="253" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="1310" dy="0">Competing consumers</tspan></text><text x="1310" y="277" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="1310" dy="0">Visibility timeout · retry</tspan></text><text x="1310" y="301" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="1310" dy="0">Отдельный сервис поверх YDB</tspan></text></g>
<g><rect x="1285" y="370" width="265" height="110" rx="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="1310" y="406" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="1310" dy="0">Print / Notify workers</tspan></text><text x="1310" y="433" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="1310" dy="0">Идемпотентный side effect</tspan></text><text x="1310" y="457" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="1310" dy="0">Ack после успеха</tspan></text></g>
<g><rect x="1285" y="550" width="265" height="95" rx="15" fill="#dc2626" stroke="#dc2626" stroke-width="2"/><text x="1310" y="586" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="1310" dy="0">DLQ</tspan></text><text x="1310" y="613" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="1310" dy="0">Разбор и контролируемый retry</tspan></text><text x="1310" y="637" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="1310" dy="0">Не отменяет документ</tspan></text></g>
<path d="M1165 425 H1235 V252 H1285" class="async" marker-end="url(#arrowPurple)"/>
<text x="1180" y="408" class="flow" text-anchor="start"><tspan x="1180" dy="0">задание по событию</tspan></text>
<path d="M1418 315 V370" class="queue-flow" marker-end="url(#arrowOrange)"/>
<text x="1432" y="348" class="flow" text-anchor="start"><tspan x="1432" dy="0">receive</tspan></text>
<path d="M1505 480 V550" class="queue-flow" marker-end="url(#arrowOrange)"/>
<text x="1430" y="521" class="flow" text-anchor="start"><tspan x="1430" dy="0">retry исчерпан</tspan></text>
<rect x="40" y="805" width="1510" height="72" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
<text x="68" y="835" class="box-title" text-anchor="start"><tspan x="68" dy="0">Гарантии</tspan></text>
<text x="180" y="835" class="box-text" text-anchor="start"><tspan x="180" dy="0">Одно проведение на operation_id · отмена обратными движениями</tspan><tspan x="180" dy="25">Consumer retry возможен · YMQ redelivery · side effect идемпотентен</tspan></text>
<text x="55" y="928" class="boundary-label" text-anchor="start"><tspan x="55" dy="0">Легенда</tspan></text>
<rect x="175" y="906" width="32" height="23" rx="5" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="217" y="924" class="box-text" text-anchor="start"><tspan x="217" dy="0">приложение</tspan></text>
<rect x="365" y="906" width="32" height="23" rx="5" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="407" y="924" class="box-text" text-anchor="start"><tspan x="407" dy="0">строковая таблица</tspan></text>
<rect x="600" y="906" width="32" height="23" rx="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
<text x="642" y="924" class="box-text" text-anchor="start"><tspan x="642" dy="0">топик / CDC</tspan></text>
<rect x="790" y="906" width="32" height="23" rx="5" fill="#f97316" stroke="#f97316" stroke-width="2"/>
<text x="832" y="924" class="box-text" text-anchor="start"><tspan x="832" dy="0">очередь</tspan></text>
<rect x="940" y="906" width="32" height="23" rx="5" fill="#0f9f9a" stroke="#0f9f9a" stroke-width="2"/>
<text x="982" y="924" class="box-text" text-anchor="start"><tspan x="982" dy="0">Coordination</tspan></text>
<rect x="1135" y="906" width="32" height="23" rx="5" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
<text x="1177" y="924" class="box-text" text-anchor="start"><tspan x="1177" dy="0">ошибка / DLQ</tspan></text>
<line x1="1355" y1="917" x2="1410" y2="917" class="async" marker-end="url(#arrowPurple)"/>
<text x="1420" y="924" class="box-text" text-anchor="start"><tspan x="1420" dy="0">асинхронно</tspan></text>
</svg>