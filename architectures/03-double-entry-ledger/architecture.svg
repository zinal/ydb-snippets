<g><rect x="1285" y="395" width="265" height="115" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1310" y="431" class="box-title" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">Интеграции</tspan></text><text x="1310" y="458" class="box-text" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">group: integrations</tspan></text><text x="1310" y="482" class="box-text" text-anchor="start" style="fill:#172033"><tspan x="1310" dy="0">Side effect идемпотентен</tspan></text></g>
