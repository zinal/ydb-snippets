<rect x="40" y="805" width="1510" height="72" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
<text x="68" y="835" class="box-title" text-anchor="start"><tspan x="68" dy="0">Гарантии</tspan></text>
<text x="180" y="835" class="box-text" text-anchor="start"><tspan x="180" dy="0">Topic/table TX атомарна · key=operation_id · append-only Postings</tspan><tspan x="180" dy="25">Consumer retry идемпотентен · CDC audit: exactly-once record, полный PK</tspan></text>
