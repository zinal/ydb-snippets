<rect x="390" y="268" width="480" height="62" rx="8" fill="#ffffff" stroke="#86efac"/><text x="405" y="293" class="box-title" text-anchor="start" style="font-size:15px"><tspan x="405" dy="0">Operations</tspan></text><text x="405" y="316" class="small" text-anchor="start" style="font-size:9.8px"><tspan x="405" dy="0">PK: (ledger_hash, ledger_id, operation_id)</tspan></text>
