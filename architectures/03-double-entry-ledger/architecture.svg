<rect x="390" y="517" width="480" height="62" rx="8" fill="#ffffff" stroke="#86efac"/><text x="405" y="542" class="box-title" text-anchor="start" style="font-size:15px"><tspan x="405" dy="0">IdempotencyKeys</tspan></text><text x="405" y="565" class="small" text-anchor="start" style="font-size:9.8px"><tspan x="405" dy="0">PK: (scope_hash, scope, idempotency_key)</tspan></text>
<rect x="390" y="589" width="480" height="56" rx="8" fill="#ffffff" stroke="#86efac"/><text x="405" y="614" class="box-title" text-anchor="start" style="font-size:15px"><tspan x="405" dy="0">ReconciliationRuns</tspan></text><text x="405" y="637" class="small" text-anchor="start" style="font-size:9.8px"><tspan x="405" dy="0">PK: (ledger_hash, ledger_id, run_id)</tspan></text>
