<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Arial, sans-serif">
<title id="title">Финансовый ledger двойной записи на YDB</title>
<desc id="desc">Posting engine одной topic/table transaction фиксирует проводки, остатки, идемпотентность и событие ledger-events с key operation_id. Опциональный CDC-аудит exactly-once пишет change records по полному PK; consumer retry остается возможным.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
<marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
<marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
<style>
text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #172033; }
.heading { font-size: 34px; font-weight: 700; } .subtitle { font-size: 17px; fill: #526176; }
.boundary-label { font-size: 20px; font-weight: 700; fill: #334155; }
.box-title { font-size: 17px; font-weight: 700; } .box-text { font-size: 14px; } .small { font-size: 12.5px; fill: #475569; }
.flow { font-size: 13px; font-weight: 700; fill: #334155; }
.arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
.async { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowPurple); }
.queue-flow { fill: none; stroke: #ea580c; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowOrange); }
</style></defs>
<rect width="1600" height="1000" fill="#f8fafc"/>
<text x="55" y="58" class="heading" text-anchor="start"><tspan x="55" dy="0">Финансовый ledger двойной записи на YDB</tspan></text>
<text x="55" y="88" class="subtitle" text-anchor="start"><tspan x="55" dy="0">Append-only проводки · сумма дебетов равна сумме кредитов · остатки в том же commit</tspan></text>
<rect x="290" y="125" width="925" height="650" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="10 7"/>
<rect x="318" y="108" width="205" height="34" rx="17" fill="#e2e8f0"/>
<text x="340" y="132" class="boundary-label" text-anchor="start"><tspan x="340" dy="0">Граница YDB</tspan></text>
<g><rect x="40" y="240" width="215" height="175" rx="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="65" y="276" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="65" dy="0">Ledger API</tspan></text><text x="65" y="303" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="65" dy="0">Entries + currency</tspan></text><text x="65" y="327" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="65" dy="0">idempotency_key</tspan></text></g>
<g><rect x="340" y="170" width="300" height="130" rx="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="365" y="206" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="365" dy="0">Posting engine</tspan></text><text x="365" y="233" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="365" dy="0">Σ debit = Σ credit</tspan></text><text x="365" y="257" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="365" dy="0">Decimal / minor units</tspan></text></g>
<rect x="320" y="330" width="580" height="405" rx="20" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="930" y="165" width="255" height="335" rx="20" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M900 350 H930" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="480" y="317" width="260" height="28" rx="14" fill="#fee2e2"/>
<text x="610" y="337" class="small" text-anchor="middle" style="fill:#b91c1c"><tspan x="610" dy="0">ACID: tables + ledger event</tspan></text>
<g><rect x="340" y="350" width="540" height="365" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/><rect x="340" y="350" width="540" height="50" rx="16" fill="#16a34a"/><path d="M340 385 H880 V400 H340 Z" fill="#16a34a"/><text x="367" y="383" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="367" dy="0">Строковые таблицы YDB</tspan></text><rect x="365" y="418" width="490" height="51" rx="8" fill="#ffffff" stroke="#86efac"/><text x="383" y="440" class="box-title" text-anchor="start"><tspan x="383" dy="0">Operations</tspan></text><text x="590" y="440" class="small" text-anchor="start"><tspan x="590" dy="0">ledger_hash, operation_id</tspan></text><rect x="365" y="476" width="490" height="51" rx="8" fill="#ffffff" stroke="#86efac"/><text x="383" y="498" class="box-title" text-anchor="start"><tspan x="383" dy="0">Postings</tspan></text><text x="590" y="498" class="small" text-anchor="start"><tspan x="590" dy="0">account_hash, bucket, operation_id</tspan></text><rect x="365" y="534" width="490" height="51" rx="8" fill="#ffffff" stroke="#86efac"/><text x="383" y="556" class="box-title" text-anchor="start"><tspan x="383" dy="0">AccountBalances</tspan></text><text x="590" y="556" class="small" text-anchor="start"><tspan x="590" dy="0">account_hash, account_id, currency</tspan></text><rect x="365" y="592" width="490" height="51" rx="8" fill="#ffffff" stroke="#86efac"/><text x="383" y="614" class="box-title" text-anchor="start"><tspan x="383" dy="0">IdempotencyKeys</tspan></text><text x="590" y="614" class="small" text-anchor="start"><tspan x="590" dy="0">scope_hash, key</tspan></text><rect x="365" y="650" width="490" height="51" rx="8" fill="#ffffff" stroke="#86efac"/><text x="383" y="672" class="box-title" text-anchor="start"><tspan x="383" dy="0">ReconciliationRuns</tspan></text><text x="590" y="672" class="small" text-anchor="start"><tspan x="590" dy="0">ledger_hash, run_id</tspan></text></g>
<g><rect x="950" y="185" width="215" height="115" rx="15" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="975" y="221" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Topic/table TX</tspan></text><text x="975" y="248" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Таблицы + событие</tspan></text><text x="975" y="272" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">key = operation_id</tspan></text></g>
<g><rect x="950" y="365" width="215" height="120" rx="15" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="975" y="401" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">YDB Topic</tspan></text><text x="975" y="428" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">ledger-events</tspan></text><text x="975" y="455" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Доменный журнал</tspan></text></g>
<g><rect x="950" y="510" width="215" height="55" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="965" y="532" class="small"><tspan x="965" dy="0">CDC audit: exactly-once</tspan></text><text x="965" y="552" class="small"><tspan x="965" dy="0">Порядок по полному PK</tspan></text></g>
<path d="M880 540 H950" class="async" marker-end="url(#arrowPurple)"/>
<g><rect x="950" y="585" width="215" height="125" rx="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="975" y="621" class="box-title" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Reconciliation service</tspan></text><text x="975" y="648" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Postings ↔ balances</tspan></text><text x="975" y="672" class="box-text" text-anchor="start" style="fill:#ffffff"><tspan x="975" dy="0">Стабильная граница</tspan></text></g>
<path d="M255 280 H340" class="arrow" marker-end="url(#arrow)"/>
<text x="270" y="263" class="flow" text-anchor="start"><tspan x="270" dy="0">команда записи</tspan></text>
<path d="M340 620 H290 V380 H255" class="arrow" marker-end="url(#arrow)"/>
<text x="265" y="605" class="flow" text-anchor="start"><tspan x="265" dy="0">чтение</tspan></text>
<path d="M490 300 V330" class="arrow" marker-end="url(#arrow)"/>
<text x="505" y="322" class="flow" text-anchor="start"><tspan x="505" dy="0">ACID commit</tspan></text>
