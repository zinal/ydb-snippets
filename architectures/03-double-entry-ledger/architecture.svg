<g><rect x="930" y="205" width="260" height="145" rx="14" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="950" y="236" class="box-title" text-anchor="start" style="fill:#ffffff;font-size:17px"><tspan x="950" dy="0">YDB Topic ledger-events</tspan></text><text x="950" y="263" class="body" text-anchor="start" style="fill:#ffffff;font-size:11.5px"><tspan x="950" dy="0">producer_id = operation_id</tspan></text><text x="950" y="285" class="body" text-anchor="start" style="fill:#ffffff;font-size:11.5px"><tspan x="950" dy="0">message_group_id = operation_id</tspan></text><text x="950" y="307" class="body" text-anchor="start" style="fill:#ffffff;font-size:11.5px"><tspan x="950" dy="0">Порядок внутри producer_id</tspan></text></g>
<g><rect x="930" y="430" width="260" height="115" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="950" y="461" class="box-title" text-anchor="start" style="fill:#172033;font-size:17px"><tspan x="950" dy="0">Опциональный CDC-аудит</tspan></text><text x="950" y="488" class="body" text-anchor="start" style="fill:#172033;font-size:11.5px"><tspan x="950" dy="0">1 record / commit</tspan></text><text x="950" y="510" class="body" text-anchor="start" style="fill:#172033;font-size:11.5px"><tspan x="950" dy="0">порядок: полный PK</tspan></text></g>
