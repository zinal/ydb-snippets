<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">CQRS с CDC и версионируемыми проекциями</title>
  <desc id="desc">Command Handler атомарно изменяет Orders и OrderLines и добавляет строки в OrderEvents. Changefeed только этой таблицы передаёт записи проекторам. Identity и порядок задаёт PK order_id, event_seq; модель чтения и consumer offset коммитятся одной topic+table транзакцией.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <style>
      text, tspan { fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .flow { font-size: 13px; font-weight: 600; }
      .app { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .table { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .topic { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .queue { fill: #ffedd5; stroke: #d97706; stroke-width: 2; }
      .coord { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; }
      .error { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .boundary { fill: #f8fafc; stroke: #334155; stroke-width: 2; stroke-dasharray: 9 6; }
      .blue-flow { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .purple-flow { fill: none; stroke: #7c3aed; stroke-width: 2.4; marker-end: url(#arrow-purple); }
      .teal-flow { fill: none; stroke: #0f766e; stroke-width: 2.4; stroke-dasharray: 6 4; marker-end: url(#arrow-teal); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="45" y="45" class="title">CQRS + CDC: OrderEvents → модели чтения</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="45" y="72" class="subtitle">Handlers, проекторы, Query API вне YDB • CDC: 1 record / commit • транзакционные offset</text>

  <rect x="40" y="100" width="330" height="125" rx="14" class="app"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="62" y="132" class="box-title">Command API</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="62" y="158" class="body">command_id • инварианты</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="62" y="182" class="small">Orders + OrderLines + OrderEvents</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="62" y="204" class="small">один ACID commit • вне YDB</text>

  <rect x="410" y="100" width="710" height="125" rx="14" class="app"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="432" y="130" class="box-title">Проекторы — вне YDB</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="432" y="155" class="body">YDB Consumer orders-summary-v1 • YDB Consumer orders-by-customer-v1</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="432" y="179" class="body">YDB Consumer orders-summary-v2-rebuild</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="432" y="202" class="small">модель чтения + offset (topic+table tx)</text>

  <rect x="1160" y="100" width="390" height="125" rx="14" class="app"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="1182" y="132" class="box-title">Query API</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="1182" y="158" class="body">только активная проекция</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="1182" y="182" class="small">ProjectionRegistry → v1 / v2</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="1182" y="204" class="small">вне YDB • ослабленная согласованность</text>

  <rect x="35" y="280" width="1530" height="520" rx="18" class="boundary"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="58" y="310" class="box-title">Граница YDB — строковые таблицы, OrderEvents changefeed, Coordination</text>

  <rect x="60" y="335" width="430" height="190" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="82" y="360" class="box-title">Модель записи + append-only</text>
  <rect x="82" y="378" width="150" height="56" rx="8" class="table"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="100" y="402" class="box-title">Orders</text><text font-family="DejaVu Sans, Arial, sans-serif" x="100" y="423" class="small">PK: order_id</text>
  <rect x="250" y="378" width="215" height="56" rx="8" class="table"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="268" y="402" class="box-title">OrderLines</text><text font-family="DejaVu Sans, Arial, sans-serif" x="268" y="423" class="small">PK: order_id, line_no</text>
  <rect x="82" y="450" width="155" height="56" rx="8" class="table"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="97" y="474" class="body">CommandResults</text><text font-family="DejaVu Sans, Arial, sans-serif" x="97" y="496" class="small">PK: command_id</text>
  <rect x="255" y="450" width="210" height="56" rx="8" class="table"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="273" y="472" class="box-title">OrderEvents</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="273" y="491" class="small">PK: order_id, event_seq</text><text font-family="DejaVu Sans, Arial, sans-serif" x="273" y="505" class="small">append-only</text>

  <rect x="520" y="365" width="220" height="115" rx="12" class="topic"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="542" y="394" class="box-title">CDC: OrderEvents</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="542" y="419" class="small">только одна таблица</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="542" y="441" class="small">1 record /</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="542" y="461" class="small">commit</text>

  <rect x="775" y="365" width="325" height="115" rx="12" class="topic"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="798" y="394" class="box-title">order-events.changefeed</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="798" y="419" class="body">внутренний changefeed</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="798" y="441" class="small">порядок: order_id, event_seq</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="798" y="461" class="small">без custom producer_id</text>

  <rect x="1130" y="345" width="400" height="155" rx="12" class="table"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="1153" y="375" class="box-title">ProcessedEvents</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="1153" y="400" class="small">PK: projection_name, source,</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="1153" y="420" class="small">order_id, event_seq</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="1153" y="447" class="body">модель чтения + встроенный offset</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="1153" y="471" class="small">topic+table tx • offset по партициям</text>

  <rect x="60" y="575" width="255" height="100" rx="11" class="table"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="82" y="605" class="box-title">OrderSummary_v1</text><text font-family="DejaVu Sans, Arial, sans-serif" x="82" y="630" class="small">PK: order_id</text><text font-family="DejaVu Sans, Arial, sans-serif" x="82" y="654" class="small">активна v1</text>
  <rect x="335" y="575" width="300" height="100" rx="11" class="table"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="357" y="603" class="box-title">OrdersByCustomer_v1</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="357" y="627" class="small">PK: customer_id, updated_bucket,</text><text font-family="DejaVu Sans, Arial, sans-serif" x="357" y="646" class="small">order_id • активна v1</text>
  <rect x="655" y="575" width="255" height="100" rx="11" class="table"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="677" y="605" class="box-title">OrderSummary_v2</text><text font-family="DejaVu Sans, Arial, sans-serif" x="677" y="630" class="small">PK: order_id</text><text font-family="DejaVu Sans, Arial, sans-serif" x="677" y="654" class="small">пересборка → догон → проверка</text>
  <rect x="930" y="575" width="275" height="100" rx="11" class="table"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="952" y="605" class="box-title">ProjectionOffsets</text><text font-family="DejaVu Sans, Arial, sans-serif" x="952" y="630" class="small">версия + диагностический lag</text><text font-family="DejaVu Sans, Arial, sans-serif" x="952" y="654" class="small">не resume-offset</text>
  <rect x="1225" y="575" width="305" height="100" rx="11" class="table"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="1247" y="605" class="box-title">ProjectionRegistry</text><text font-family="DejaVu Sans, Arial, sans-serif" x="1247" y="630" class="small">projection_name → v1 / v2</text><text font-family="DejaVu Sans, Arial, sans-serif" x="1247" y="654" class="small">атомарное переключение</text>

  <rect x="690" y="710" width="380" height="65" rx="11" class="coord"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="712" y="738" class="box-title">Coordination</text><text font-family="DejaVu Sans, Arial, sans-serif" x="712" y="761" class="small">lease пересборки • не ACID</text>

  <path d="M205 225 L205 326" class="blue-flow"/><text font-family="DejaVu Sans, Arial, sans-serif" x="217" y="270" class="flow">ACID запись</text>
  <path d="M465 478 L505 478 L505 422 L511 422" class="purple-flow"/>
  <path d="M740 422 L766 422" class="purple-flow"/>
  <path d="M938 365 L938 234" class="purple-flow"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="950" y="270" class="small">именованные YDB Consumers</text>
  <path d="M1080 225 L1115 250 L1115 545 L188 545 L188 566" class="blue-flow"/>
  <path d="M1115 422 L1121 422" class="blue-flow"/>
  <path d="M1115 545 L485 545 L485 566" class="blue-flow"/>
  <path d="M1115 545 L782 545 L782 566" class="blue-flow"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="900" y="536" class="small">topic+table tx: модель + ProcessedEvents + offset</text>
  <path d="M1378 575 L1378 545 L1545 545 L1545 245 L1355 245 L1355 234" class="blue-flow"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="1420" y="535" class="small">активная версия</text>
  <path d="M880 710 L880 690 L1378 690 L1378 684" class="teal-flow"/>

  <rect x="50" y="830" width="1500" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="75" y="858" class="box-title">Гарантии</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="75" y="883" class="body">CDC: 1 record / commit (OrderEvents) • повтор чтения возможен</text>
  <text font-family="DejaVu Sans, Arial, sans-serif" x="75" y="905" class="small">identity: source + order_id + event_seq • offset по партициям • ослабленная согласованность • идемпотентность</text>

  <text font-family="DejaVu Sans, Arial, sans-serif" x="50" y="965" class="box-title">Легенда:</text>
  <rect x="150" y="947" width="24" height="18" rx="3" class="app"/><text font-family="DejaVu Sans, Arial, sans-serif" x="183" y="962" class="body">приложение</text>
  <rect x="350" y="947" width="24" height="18" rx="3" class="table"/><text font-family="DejaVu Sans, Arial, sans-serif" x="383" y="962" class="body">строковая таблица</text>
  <rect x="510" y="947" width="24" height="18" rx="3" class="topic"/><text font-family="DejaVu Sans, Arial, sans-serif" x="543" y="962" class="body">CDC / Topic</text>
  <rect x="690" y="947" width="24" height="18" rx="3" class="coord"/><text font-family="DejaVu Sans, Arial, sans-serif" x="723" y="962" class="body">Coordination</text>
  <line x1="900" y1="956" x2="960" y2="956" class="purple-flow"/><text font-family="DejaVu Sans, Arial, sans-serif" x="970" y="962" class="body">асинхронно</text>
  <line x1="1130" y1="956" x2="1190" y2="956" class="blue-flow"/><text font-family="DejaVu Sans, Arial, sans-serif" x="1200" y="962" class="body">транзакционно</text>
</svg>
