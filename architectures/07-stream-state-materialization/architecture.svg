<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Потоковая материализация операционного состояния в YDB</title>
  <desc id="desc">Архитектура поддерживает актуальное операционное состояние сущностей по потоку событий: последнее состояние, счетчики и активные предупреждения.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker></defs>
  <rect x="0" y="0" width="1600" height="1000" fill="#f8fafc"/>
  <text x="800" y="42" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Потоковая материализация операционного состояния в YDB</text>
  <text x="800" y="72" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#475569">Producer/Процессор · транзакция Topic+таблицы · CDC опционально</text>
  <rect x="60" y="90" width="1480" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="122" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Легенда:</text>
  <rect x="175" y="106" width="26" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="122" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">приложение</text>
  <rect x="345" y="106" width="26" height="20" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="122" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">строковая таблица</text>
  <rect x="500" y="106" width="26" height="20" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="535" y="122" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">Topic / CDC</text>
  <rect x="700" y="106" width="26" height="20" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="735" y="122" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">механизм YDB</text>
  <path d="M 1190 117 L 1240 117" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1250" y="122" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">синхронно</text>
  <path d="M 1400 117 L 1450 117" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="1460" y="122" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">асинхронно</text>
  <rect x="350" y="205" width="1060" height="595" rx="24" fill="#ffffff" stroke="#0f6cbd" stroke-width="4"/>
  <text x="375" y="239" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0f6cbd">Граница YDB</text>
  <rect x="115" y="245" width="1250" height="380" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="740.0" y="272" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#166534">Транзакция Topic+таблицы</text>
  <text x="740.0" y="293" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#166534">чтение Topic + таблицы + Downstream + offset</text>
  <rect x="10" y="260" width="95" height="110" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="57.5" y="298.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Producer</text>
  <text x="57.5" y="320.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1e40af">event_id</text>
  <text x="57.5" y="342.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1e40af">entity_id</text>
  <rect x="130" y="425" width="180" height="145" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="220.0" y="475.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Процессор</text>
  <text x="220.0" y="497.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1e40af">YDB Consumer</text>
  <text x="220.0" y="520.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1e40af">материализация</text>
  <rect x="390" y="295" width="230" height="175" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="505.0" y="335.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6b21a8">Входной Topic</text>
  <text x="505.0" y="356.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">producer_id =</text>
  <text x="505.0" y="377.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">message_group_id =</text>
  <text x="505.0" y="398.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">entity_id</text>
  <text x="505.0" y="419.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">YDB Consumer:</text>
  <text x="505.0" y="440.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">материализатор</text>
  <text x="505.0" y="458.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b21a8">порядок внутри producer_id</text>
  <rect x="665" y="305" width="190" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="760.0" y="338.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">CurrentState</text>
  <text x="760.0" y="360.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#166534">PK: entity_id</text>
  <text x="760.0" y="382.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#166534">текущее состояние</text>
  <rect x="880" y="305" width="190" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="975.0" y="338.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">Counters</text>
  <text x="975.0" y="360.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#166534">PK: entity_id</text>
  <text x="975.0" y="382.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#166534">счетчики</text>
  <rect x="665" y="440" width="190" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="760.0" y="473.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">Alerts</text>
  <text x="760.0" y="495.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#166534">PK: entity_id</text>
  <text x="760.0" y="517.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#166534">алерты</text>
  <rect x="1120" y="295" width="220" height="175" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="1230.0" y="343.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6b21a8">Исходящий Topic</text>
  <text x="1230.0" y="365.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">producer_id =</text>
  <text x="1230.0" y="387.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">message_group_id =</text>
  <text x="1230.0" y="409.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">entity_id</text>
  <text x="1230.0" y="431.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">запись в транзакции</text>
  <text x="1230.0" y="451.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b21a8">порядок внутри producer_id</text>
  <rect x="390" y="635" width="220" height="110" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
  <text x="500.0" y="673.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#334155">Transfer</text>
  <text x="500.0" y="695.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">опционально</text>
  <text x="500.0" y="717.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">stateless + UPSERT</text>
  <rect x="1130" y="625" width="240" height="125" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="1250.0" y="650.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6b21a8">CDC (опционально)</text>
  <text x="1250.0" y="670.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">1 record /</text>
  <text x="1250.0" y="690.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">commit</text>
  <text x="1250.0" y="710.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b21a8">чтение может повторяться</text>
  <text x="1250.0" y="730.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b21a8">без custom producer_id</text>
  <text x="850" y="600" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">Атомарный commit: таблицы + offset Consumer</text>
  <text x="850" y="620" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">Downstream виден в том же commit</text>
  <path d="M 105 315 L 390 345" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="245" y="295" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">публикация</text>
  <path d="M 390 410 L 330 410 L 330 480 L 310 480" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="350" y="395" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">чтение в транзакции</text>
  <path d="M 310 480 L 640 480 L 640 355 L 665 355" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="500" y="498" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">изменения таблиц</text>
  <path d="M 310 520 L 330 520 L 330 570 L 1090 570 L 1090 382 L 1120 382" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="770" y="555" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">запись Topic + commit offset</text>
  <path d="M 1070 490 L 1100 490 L 1100 688 L 1130 688" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="1010" y="650" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">CDC после commit</text>
  <path d="M 505 470 L 505 635" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="525" y="560" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#334155">опциональный путь</text>
  <rect x="90" y="830" width="1420" height="155" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="800" y="855" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9a3412">Гарантии</text>
  <text x="800" y="880" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">Topics: producer_id = message_group_id = entity_id; порядок внутри producer_id</text>
  <text x="800" y="903" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">Одна транзакция: таблицы + offset Consumer + Downstream атомарно</text>
  <text x="800" y="926" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">CDC: 1 record / commit; чтение может повторяться</text>
  <text x="800" y="949" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">Внешние подписчики идемпотентны; exactly-once не обещается</text>
</svg>
