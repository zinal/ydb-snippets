  <text x="795" y="903" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#9a3412">Transaction: Topic read + row-table changes + consumer offset commit.</text>
  <text x="795" y="926" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#9a3412">CDC writes each change record exactly once.</text>
  <text x="795" y="949" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#9a3412">Subscriber processing may repeat; subscribers keep progress and stay idempotent.</text>
