  <title id="title">Долгоживущий workflow и Saga в YDB</title>
  <desc id="desc">Архитектура реализует оркестрируемую Saga: конечный автомат хранит состояние долгоживущего workflow, выдает идемпотентные команды, принимает результаты, запускает таймеры и выполняет компенсации.</desc>
