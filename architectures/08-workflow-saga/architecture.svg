  <text x="795" y="903" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#9a3412">Coordination provides only a session-bound leader lease.</text>
  <text x="795" y="926" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#9a3412">DispatcherEpoch row table transactionally creates the monotonic epoch.</text>
