  <rect x="0" y="0" width="1600" height="1000" fill="#f8fafc"/>
  <text x="800" y="42" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Долгоживущий workflow и Saga в YDB</text>
  <text x="800" y="72" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#475569">External applications · SQS-compatible protocol inside YDB · lease and epoch remain separate</text>
