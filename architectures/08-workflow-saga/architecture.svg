<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Долгоживущий workflow и Saga в YDB</title>
  <desc id="desc">Архитектура workflow/Saga использует встроенный SQS-compatible protocol: SQS queue и DLQ находятся внутри YDB, а relay и workers являются внешними приложениями.</desc>
