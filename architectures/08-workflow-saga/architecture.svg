  <text x="1180" y="430" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#dc2626">redrive</text>
  <rect x="70" y="835" width="1460" height="150" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="800" y="860" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9a3412">Guarantees and boundaries</text>
  <text x="800" y="886" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">Topics are pub/sub logs with named YDB Consumers; SQS uses competing consumers and visibility.</text>
  <text x="800" y="908" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">CommandOutbox commit and SQS enqueue are not one transaction; CDC/relay closes the delivery gap.</text>
  <text x="800" y="930" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">Coordination supplies only a session lease; DispatcherEpoch is incremented in a row-table transaction.</text>
  <text x="800" y="952" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">Timers → dispatcher is due scan/claim; dispatcher → YDB is transactional claim/ack.</text>
  <text x="800" y="974" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">Workers and external effects remain idempotent; retry exhaustion moves a message to SQS DLQ.</text>
</svg>
