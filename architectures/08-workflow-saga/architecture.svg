  <text x="800" y="855" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9a3412">Guarantees and boundaries</text>
  <text x="800" y="880" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">Coordination supplies only a session-bound leader lease; it never creates the epoch.</text>
  <text x="800" y="903" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">A new leader transactionally increments DispatcherEpoch; TimerDispatchLease and writes verify it.</text>
  <text x="800" y="926" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">Timers table → dispatcher is due scan/claim; dispatcher → YDB is transactional claim/ack.</text>
  <text x="800" y="949" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">Result Topic order is within producer_id = message_group_id = workflow_id.</text>
  <text x="800" y="972" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7c2d12">If CDC is used: one change record per committed row change; relay/read processing may repeat.</text>
</svg>
