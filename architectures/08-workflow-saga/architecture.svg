  <rect x="105" y="580" width="175" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="192.5" y="600.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#334155">due timer scan / claim</text>
