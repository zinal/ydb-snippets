  <text x="1077.5" y="658.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1e40af">Status relay</text>
  <text x="1077.5" y="682.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1e40af">repeat-safe</text>
