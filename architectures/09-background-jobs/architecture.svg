  <text x="807" y="345" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">CDC record</text>
  <path d="M 990 360 L 1210 360 L 1240 360" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="1100" y="345" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">send</text>
  <path d="M 1240 390 L 1185 390 L 1185 440 L 1085 440 L 1085 420" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="1160" y="425" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">receive</text>
  <path d="M 1015 390 L 970 390 L 970 500 L 900 500" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="950" y="485" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">result tx</text>
  <path d="M 1240 420 L 1200 420 L 1200 537 L 1240 537" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="1200" y="475" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">retry → DLQ</text>
