  <text x="1085.0" y="413.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1e40af">key = job_id</text>
  <rect x="1240" y="300" width="300" height="120" rx="14" fill="#ffedd5" stroke="#f97316" stroke-width="2.5"/>
