  <text x="907.5" y="329.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1e40af">Dispatch relay</text>
  <text x="907.5" y="353.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1e40af">CDC processing</text>
  <text x="907.5" y="377.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1e40af">may repeat</text>
  <text x="907.5" y="401.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1e40af">stable message_id</text>
  <rect x="1015" y="300" width="140" height="120" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="1085.0" y="317.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1e40af">Workers</text>
  <text x="1085.0" y="341.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1e40af">extend</text>
