  <text x="605.0" y="712.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#166534">stable key</text>
  <rect x="730" y="650" width="200" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="830.0" y="688.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#166534">StatusOutbox</text>
  <text x="830.0" y="712.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#166534">status event</text>
