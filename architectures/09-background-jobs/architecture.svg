  <text x="535" y="775" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">external ≥ 1</text>
  <path d="M 930 695 L 975 695 L 975 547 L 1000 547" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="980" y="675" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">committed status</text>
  <path d="M 1077 595 L 1077 625" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="1090" y="613" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">CDC record</text>
  <path d="M 1077 705 L 1077 730" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="1090" y="722" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">publish</text>
  <rect x="105" y="850" width="1380" height="135" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="795" y="877" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#9a3412">Гарантии и границы</text>
  <text x="795" y="903" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#9a3412">Initial transaction has no dual-write: business data + Jobs + Outbox.</text>
  <text x="795" y="926" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#9a3412">Result transaction atomically updates Jobs, JobResults, IdempotencyKeys and StatusOutbox.</text>
  <text x="795" y="949" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#9a3412">CDC writes each change record exactly once; relay and subscriber processing may repeat.</text>
  <text x="795" y="972" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#9a3412">A queue alone cannot provide exactly-once external side effects.</text>
</svg>
