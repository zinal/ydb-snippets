  <text x="1077.5" y="760.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#6b21a8">Status Topic</text>
  <text x="1077.5" y="784.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#6b21a8">pub/sub log</text>
  <rect x="10" y="650" width="95" height="105" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
