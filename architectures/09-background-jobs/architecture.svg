  <text x="57.5" y="720.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1e40af">idempotency</text>
  <text x="57.5" y="744.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1e40af">job_id</text>
  <path d="M 105 402 L 160 402" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="132" y="387" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">sync tx</text>
  <path d="M 450 505 L 590 505 L 590 360 L 610 360" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="560" y="490" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#334155">committed row</text>
