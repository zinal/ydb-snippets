  <text x="1077.5" y="552.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#6b21a8">exactly-once</text>
  <text x="1077.5" y="576.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#6b21a8">change record</text>
