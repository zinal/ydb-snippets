<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура резервирования ограниченных ресурсов в YDB</title>
  <desc id="desc">Резервирование и ExpirationOutbox в одной транзакции таблиц. CDC и внешний relay ставят задания в очередь SQS YDB; workers используют visibility timeout и ack/delete.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <style>
      .txt { font-family: "DejaVu Sans", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526075; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .boundary { fill: #f8fbff; stroke: #2563a6; stroke-width: 3; }
      .tx { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 9 7; }
      .app { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .table { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .topic { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .sqs { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; }
      .coord { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; }
      .error { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .event { fill: none; stroke: #7e22ce; stroke-width: 2.2; marker-end: url(#arrow); }
      .queue { fill: none; stroke: #c2410c; stroke-width: 2.2; marker-end: url(#arrow); }
      .coord-flow { fill: none; stroke: #0f766e; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .error-flow { fill: none; stroke: #dc2626; stroke-width: 2.2; marker-end: url(#arrow); }
      .recovery { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .label-bg { fill: #ffffff; opacity: 0.96; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#f8fafc"/>
  <text class="txt title" x="50" y="58">Резервирование ограниченных ресурсов</text>
  <text class="txt subtitle" x="50" y="88">ACID-инвариант остатка, идемпотентные команды и at-least-once фоновые процессы</text>

  <rect class="boundary" x="330" y="145" width="890" height="650" rx="22"/>
  <text class="txt box-title" x="360" y="183">Граница YDB</text>
  <text class="txt small" x="510" y="183">строковые таблицы, Topic/CDC, Coordination, SQS</text>

  <rect class="tx" x="375" y="215" width="800" height="355" rx="18"/>
  <text class="txt box-title" x="400" y="248">ACID-транзакция резервирования</text>
  <text class="txt small" x="400" y="270">резерв + результат + Outbox</text>

  <path class="coord-flow" d="M455 620 L455 585 L339 585 L339 300 L375 300"/>
  <path class="flow" d="M270 350 H375"/>
  <path class="flow" d="M584 350 L620 350"/>
  <path class="flow" d="M860 350 H900"/>
  <path class="flow" d="M750 402 L750 438"/>
  <path class="event" d="M500 410 L500 564 L900 564 L900 600"/>
  <path class="event" d="M1040 538 L1040 564 L900 564 L900 600"/>
  <path class="event" d="M1000 630 H1270"/>
  <path class="event" d="M821 650 L785 650"/>
  <path class="queue" d="M1270 640 H1200"/>
  <path class="queue" d="M1015 675 L1007 675 L1007 810 L306 810 L306 650 L270 650"/>
  <path class="error-flow" d="M1107 684 L1107 720"/>
  <path class="recovery" d="M1270 620 H1190 V520 H1145"/>

  <rect class="label-bg" x="278" y="319" width="90" height="23" rx="5"/>
  <text class="txt small" x="288" y="336">команда</text>
  <rect class="label-bg" x="613" y="322" width="66" height="22" rx="5"/>
  <text class="txt small" x="620" y="338">создать</text>
  <rect class="label-bg" x="856" y="322" width="72" height="22" rx="5"/>
  <text class="txt small" x="864" y="338">результат</text>
  <rect class="label-bg" x="650" y="578" width="130" height="23" rx="5"/>
  <text class="txt small" x="660" y="595">изменение строки</text>
  <rect class="label-bg" x="1173" y="624" width="91" height="23" rx="5"/>
  <text class="txt small" x="1183" y="641">changefeed</text>
  <rect class="label-bg" x="1188" y="534" width="75" height="23" rx="5"/>
  <text class="txt small" x="1198" y="551">recovery</text>
  <rect class="label-bg" x="1080" y="575" width="170" height="40" rx="5"/>
  <text class="txt small" x="1090" y="591">проверить состояние</text>
  <text class="txt small" x="1090" y="607">и expires_at</text>

  <rect class="app" x="50" y="285" width="220" height="130" rx="14"/>
  <text class="txt box-title" x="80" y="323">API резервирования</text>
  <text class="txt body" x="80" y="351">создать / подтвердить / отменить</text>
  <text class="txt body" x="80" y="377">idempotency_key</text>

  <rect class="app" x="50" y="585" width="220" height="130" rx="14"/>
  <text class="txt box-title" x="80" y="623">Worker истечения</text>
  <text class="txt body" x="80" y="651">конкурирующие</text>
  <text class="txt body" x="80" y="677">условный expire</text>

  <rect class="table" x="400" y="300" width="190" height="110" rx="12"/>
  <text class="txt box-title" x="425" y="333">Resources</text>
  <text class="txt body" x="425" y="359">key: resource_id</text>
  <text class="txt body" x="425" y="384">available, version</text>

  <rect class="table" x="620" y="300" width="240" height="110" rx="12"/>
  <text class="txt box-title" x="640" y="330">Reservations</text>
  <text class="txt small" x="640" y="351">key: resource_id,</text>
  <text class="txt small" x="640" y="372">reservation_id</text>
  <text class="txt small" x="640" y="397">state, qty, expires_at</text>

  <rect class="table" x="900" y="300" width="225" height="110" rx="12"/>
  <text class="txt box-title" x="925" y="333">Operations</text>
  <text class="txt body" x="925" y="359">key: operation_id</text>
  <text class="txt body" x="925" y="384">status, saved_result</text>

  <rect class="table" x="630" y="438" width="270" height="100" rx="12"/>
  <text class="txt box-title" x="655" y="471">IdempotencyKeys</text>
  <text class="txt body" x="655" y="497">client_id, idempotency_key</text>
  <text class="txt body" x="655" y="521">operation_id, response</text>

  <rect class="table" x="930" y="438" width="215" height="100" rx="12"/>
  <text class="txt box-title" x="950" y="471">ExpirationOutbox</text>
  <text class="txt small" x="950" y="495">resource_id,</text>
  <text class="txt small" x="950" y="515">reservation_id, job_id</text>
  <text class="txt small" x="950" y="529">expires_at, pending</text>

  <rect class="coord" x="350" y="600" width="170" height="160" rx="12"/>
  <text class="txt body" x="370" y="630" font-weight="700">Семафор</text>
  <text class="txt body" x="370" y="650" font-weight="700">Coordination</text>
  <text class="txt small" x="370" y="678">только</text>
  <text class="txt small" x="370" y="699">admission control</text>

  <rect class="topic" x="535" y="600" width="250" height="160" rx="12"/>
  <text class="txt body" x="555" y="630" font-weight="700">Topic доступности</text>
  <text class="txt small" x="555" y="654">producer_id = resource_id</text>
  <text class="txt small" x="555" y="675">message_group_id = resource_id</text>
  <text class="txt small" x="555" y="696">порядок внутри producer_id</text>
  <text class="txt small" x="555" y="717">YDB Consumer:</text>
  <text class="txt small" x="555" y="738">availability-view</text>

  <rect class="topic" x="800" y="600" width="200" height="160" rx="12"/>
  <text class="txt body" x="820" y="630" font-weight="700">CDC changefeed</text>
  <text class="txt small" x="820" y="654">1 record / commit</text>
  <text class="txt small" x="820" y="675">чтение может</text>
  <text class="txt small" x="820" y="696">повторяться</text>
  <text class="txt small" x="820" y="717">без custom producer_id</text>

  <rect class="sqs" x="1015" y="600" width="185" height="110" rx="12"/>
  <text class="txt body" x="1030" y="623" font-weight="700">Очередь истечения SQS</text>
  <text class="txt tiny" x="1030" y="643">протокол SQS в YDB</text>
  <text class="txt tiny" x="1030" y="661">конкурирующие; visibility</text>
  <text class="txt tiny" x="1030" y="679">ack/delete + retries</text>

  <rect class="error" x="1015" y="720" width="185" height="40" rx="10"/>
  <text class="txt body" x="1048" y="746" font-weight="700">DLQ истечения</text>

  <rect class="app" x="1270" y="585" width="280" height="95" rx="14"/>
  <text class="txt box-title" x="1300" y="617">Relay истечения</text>
  <text class="txt small" x="1300" y="642">идемпотентный enqueue</text>
  <text class="txt small" x="1300" y="663">recovery scan</text>

  <rect x="50" y="835" width="1500" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="txt box-title" x="75" y="869">Гарантии</text>
  <text class="txt body" x="75" y="900">Outbox: таблица → SQS; нет общей table+SQS транзакции · протокол SQS в YDB</text>
  <text class="txt body" x="75" y="928">SQS: конкурирующие, visibility, ack/delete, DLQ · CDC может повторяться · идемпотентные эффекты</text>

  <rect class="app" x="1040" y="867" width="26" height="18" rx="3"/>
  <text class="txt small" x="1075" y="881">приложение</text>
  <rect class="table" x="1165" y="867" width="26" height="18" rx="3"/>
  <text class="txt small" x="1200" y="881">строковая таблица</text>
  <rect class="topic" x="1345" y="867" width="26" height="18" rx="3"/>
  <text class="txt small" x="1380" y="881">Topic / CDC</text>
  <rect class="sqs" x="1475" y="867" width="26" height="18" rx="3"/>
  <text class="txt small" x="1510" y="881">SQS</text>
  <rect class="coord" x="1040" y="910" width="26" height="18" rx="3"/>
  <text class="txt small" x="1075" y="924">Coordination</text>
  <rect class="error" x="1235" y="910" width="26" height="18" rx="3"/>
  <text class="txt small" x="1270" y="924">DLQ</text>
</svg>
