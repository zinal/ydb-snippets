<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура распределенного планировщика в YDB</title>
  <desc id="desc">SchedulerEpoch ограничивает только новый dispatch. CDC ExecutionOutbox и внешний relay ставят задачи в очередь SQS YDB; смена лидера не инвалидирует committed executions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <style>
      .txt { font-family: "DejaVu Sans", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526075; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .boundary { fill: #f8fbff; stroke: #2563a6; stroke-width: 3; }
      .tx { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 9 7; }
      .app { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .table { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .topic { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .sqs { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; }
      .coord { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; }
      .error { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .event { fill: none; stroke: #7e22ce; stroke-width: 2.2; marker-end: url(#arrow); }
      .queue { fill: none; stroke: #c2410c; stroke-width: 2.2; marker-end: url(#arrow); }
      .queue-ack { fill: none; stroke: #c2410c; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .coord-flow { fill: none; stroke: #0f766e; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .error-flow { fill: none; stroke: #dc2626; stroke-width: 2.2; marker-end: url(#arrow); }
      .recovery { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .label-bg { fill: #ffffff; opacity: 0.96; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#f8fafc"/>
  <text class="txt title" x="50" y="58">Распределенный планировщик заданий</text>
  <text class="txt subtitle" x="50" y="88">SchedulerEpoch только для нового dispatch; executions переживают смену лидера</text>

  <rect class="boundary" x="310" y="135" width="900" height="650" rx="22"/>
  <text class="txt box-title" x="340" y="173">Граница YDB</text>
  <text class="txt small" x="500" y="173">строковые таблицы, Topic/CDC, Coordination, SQS</text>

  <rect class="tx" x="345" y="345" width="830" height="310" rx="18"/>
  <text class="txt box-title" x="370" y="378">ACID-транзакции таблиц</text>
  <text class="txt small" x="370" y="401">dispatch: проверка epoch · worker: execution_id + state, не epoch</text>

  <path class="coord-flow" d="M270 245 H350"/>
  <path class="coord-flow" d="M306 285 L270 285"/>
  <path class="flow" d="M270 340 L309 340 L309 445 L345 445"/>
  <path class="flow" d="M524 475 L560 475"/>
  <path class="flow" d="M744 475 L780 475"/>
  <path class="flow" d="M905 499 L905 535"/>
  <path class="event" d="M1145 585 L1216 585 L1216 255 L1180 255"/>
  <path class="event" d="M1180 255 H1260"/>
  <path class="queue" d="M1350 290 L1200 290 L1200 805 L574 805 L574 707 L610 707"/>
  <path class="recovery" d="M1260 270 L1215 270 L1215 330 L1181 330 L1181 535 L1145 535"/>
  <path class="queue" d="M830 700 L850 700 L850 820 L1224 820 L1224 600 L1260 600"/>
  <path class="queue-ack" d="M1260 650 L1245 650 L1245 835 L866 835 L866 730 L830 730"/>
  <path class="error-flow" d="M720 716 L720 752"/>
  <path class="flow" d="M1260 640 L1225 640 L1225 330 L524 330 L524 590 L560 590"/>
  <path class="flow" d="M576 610 L540 610"/>
  <path class="event" d="M420 634 L420 670"/>
  <path class="event" d="M330 722 H270"/>
  <path class="event" d="M270 750 L300 750 L300 816 L1025 816 L1025 780"/>

  <rect class="label-bg" x="282" y="217" width="59" height="22" rx="5"/>
  <text class="txt small" x="290" y="233">сессия</text>
  <rect class="label-bg" x="300" y="298" width="150" height="30" rx="5"/>
  <text class="txt small" x="310" y="318">только leader lease</text>
  <rect class="label-bg" x="289" y="411" width="111" height="22" rx="5"/>
  <text class="txt small" x="298" y="427">due dispatch</text>
  <rect class="label-bg" x="1055" y="307" width="95" height="22" rx="5"/>
  <text class="txt small" x="1065" y="323">recovery scan</text>
  <rect class="label-bg" x="715" y="315" width="126" height="22" rx="5"/>
  <text class="txt small" x="725" y="331">проверить id + state</text>
  <rect class="label-bg" x="1160" y="445" width="75" height="22" rx="5"/>
  <text class="txt small" x="1170" y="461">enqueue</text>
  <rect class="label-bg" x="1185" y="720" width="55" height="22" rx="5"/>
  <text class="txt small" x="1195" y="736">claim</text>
  <rect class="label-bg" x="950" y="808" width="82" height="22" rx="5"/>
  <text class="txt small" x="960" y="824">ack/delete</text>

  <rect class="app" x="40" y="200" width="230" height="210" rx="14"/>
  <text class="txt box-title" x="70" y="235">Экземпляры планировщика</text>
  <text class="txt body" x="70" y="268">scheduler-1</text>
  <text class="txt body" x="70" y="298">scheduler-2</text>
  <text class="txt body" x="70" y="328">scheduler-N</text>
  <text class="txt body" x="70" y="370">диспетчер = лидер</text>

  <rect class="coord" x="350" y="200" width="360" height="105" rx="14"/>
  <text class="txt box-title" x="380" y="235">Leader election</text>
  <text class="txt body" x="380" y="263">только session lease</text>
  <text class="txt body" x="380" y="286">не выдает epoch; не ACID</text>

  <rect class="topic" x="850" y="190" width="330" height="130" rx="14"/>
  <text class="txt box-title" x="880" y="223">ExecutionOutbox changefeed</text>
  <text class="txt small" x="880" y="249">1 record / commit</text>
  <text class="txt small" x="880" y="273">чтение может повторяться</text>
  <text class="txt small" x="880" y="297">source: ExecutionOutbox</text>

  <rect class="table" x="370" y="420" width="170" height="110" rx="12"/>
  <text class="txt box-title" x="395" y="453">Schedules</text>
  <text class="txt body" x="395" y="479">key: schedule_id</text>
  <text class="txt body" x="395" y="504">next_run_at, version</text>

  <rect class="table" x="560" y="420" width="190" height="110" rx="12"/>
  <text class="txt box-title" x="580" y="453">SchedulerEpoch</text>
  <text class="txt body" x="580" y="479">key: scheduler_name</text>
  <text class="txt small" x="580" y="502">epoch++ только для</text>
  <text class="txt small" x="580" y="520">нового dispatch</text>

  <rect class="table" x="780" y="420" width="250" height="110" rx="12"/>
  <text class="txt box-title" x="805" y="453">ExecutionLeases</text>
  <text class="txt body" x="805" y="479">key: execution_id</text>
  <text class="txt small" x="805" y="504">owner, attempt, deadline, state</text>

  <rect class="table" x="370" y="535" width="170" height="115" rx="12"/>
  <text class="txt small" x="382" y="558" font-weight="700">ExecutionResultEvents</text>
  <text class="txt small" x="385" y="580">append-only ключ:</text>
  <text class="txt small" x="385" y="598">schedule_id</text>
  <text class="txt small" x="385" y="616">execution_id</text>
  <text class="txt small" x="385" y="634">result_seq, ...</text>

  <rect class="table" x="560" y="535" width="245" height="115" rx="12"/>
  <text class="txt box-title" x="585" y="568">ExecutionHistory</text>
  <text class="txt body" x="585" y="594">schedule_id, execution_id</text>
  <text class="txt body" x="585" y="620">attempt, status, terminal result</text>

  <rect class="table" x="835" y="535" width="310" height="115" rx="12"/>
  <text class="txt box-title" x="860" y="568">ExecutionOutbox</text>
  <text class="txt small" x="860" y="592">key: execution_id; payload, stable task_id</text>
  <text class="txt small" x="860" y="614">created_by_epoch: только аудит</text>
  <text class="txt small" x="860" y="636">dispatch переживает смену epoch</text>

  <rect class="topic" x="330" y="670" width="260" height="105" rx="14"/>
  <text class="txt body" x="355" y="696" font-weight="700">ExecutionResultEvents CDC</text>
  <text class="txt small" x="355" y="719">1 record / commit</text>
  <text class="txt small" x="355" y="740">чтение может</text>
  <text class="txt small" x="355" y="761">повторяться</text>

  <rect class="topic" x="870" y="660" width="310" height="120" rx="14"/>
  <text class="txt box-title" x="895" y="686">execution.results Topic</text>
  <text class="txt small" x="895" y="708">producer_id = schedule_id</text>
  <text class="txt small" x="895" y="729">message_group_id = schedule_id</text>
  <text class="txt small" x="895" y="750">порядок внутри producer_id</text>
  <text class="txt small" x="895" y="771">YDB Consumer: result-handler</text>

  <rect class="app" x="1260" y="170" width="290" height="120" rx="14"/>
  <text class="txt box-title" x="1290" y="204">Dispatch relay</text>
  <text class="txt small" x="1290" y="230">YDB Consumer: dispatch-relay</text>
  <text class="txt small" x="1290" y="252">идемпотентный enqueue</text>
  <text class="txt small" x="1290" y="274">recovery scan</text>

  <rect class="sqs" x="610" y="670" width="220" height="75" rx="12"/>
  <text class="txt body" x="630" y="689" font-weight="700">Очередь задач SQS</text>
  <text class="txt tiny" x="630" y="706">протокол SQS в YDB</text>
  <text class="txt tiny" x="630" y="722">конкурирующие; visibility</text>
  <text class="txt tiny" x="630" y="738">ack/delete + retries</text>

  <rect class="error" x="610" y="752" width="220" height="28" rx="8"/>
  <text class="txt small" x="686" y="772" font-weight="700">DLQ SQS</text>

  <rect class="app" x="1260" y="540" width="290" height="145" rx="14"/>
  <text class="txt box-title" x="1290" y="575">Workers</text>
  <text class="txt small" x="1290" y="603">claim execution_id + attempt</text>
  <text class="txt small" x="1290" y="625">ожидаемое nonterminal-состояние</text>
  <text class="txt small" x="1290" y="647">идемпотентный эффект; 1 commit</text>
  <text class="txt small" x="1290" y="669">не проверять SchedulerEpoch</text>

  <rect class="app" x="40" y="650" width="230" height="110" rx="14"/>
  <text class="txt box-title" x="65" y="683">Result relay / filter</text>
  <text class="txt small" x="65" y="708">YDB Consumer: result-relay</text>
  <text class="txt small" x="65" y="730">стабильный контракт</text>
  <text class="txt small" x="65" y="752">идемпотентный publish</text>

  <rect x="40" y="845" width="1500" height="110" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="txt box-title" x="65" y="879">Гарантии</text>
  <text class="txt body" x="65" y="906">ExecutionOutbox: таблица → SQS; нет общей table+SQS транзакции · SchedulerEpoch для нового dispatch</text>
  <text class="txt body" x="65" y="932">SQS: конкурирующие, visibility, ack/delete, DLQ · CDC может повторяться · один terminal commit</text>

  <rect class="app" x="1020" y="872" width="26" height="18" rx="3"/>
  <text class="txt small" x="1055" y="886">приложение</text>
  <rect class="table" x="1145" y="872" width="26" height="18" rx="3"/>
  <text class="txt small" x="1180" y="886">строковая таблица</text>
  <rect class="topic" x="1325" y="872" width="26" height="18" rx="3"/>
  <text class="txt small" x="1360" y="886">Topic / CDC</text>
  <rect class="sqs" x="1460" y="872" width="26" height="18" rx="3"/>
  <text class="txt small" x="1495" y="886">SQS</text>
  <rect class="coord" x="1020" y="919" width="26" height="18" rx="3"/>
  <text class="txt small" x="1055" y="933">Coordination</text>
  <rect class="error" x="1215" y="919" width="26" height="18" rx="3"/>
  <text class="txt small" x="1250" y="933">DLQ</text>
</svg>
