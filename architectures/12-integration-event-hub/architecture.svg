<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура интеграционного событийного хаба в YDB</title>
  <desc id="desc">Systems connect through APIs, SDK, and Kafka API. Inbox, CanonicalState, DeliveryStatus, and DispatchIntent commit atomically. CanonicalState CDC goes directly to Outgoing Topics; a recovery relay publishes explicit intents or enqueues external YMQ commands.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .txt { font-family: "DejaVu Sans", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526075; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 13px; }
      .boundary { fill: #f8fbff; stroke: #2563a6; stroke-width: 3; }
      .tx { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 9 7; }
      .app { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .table { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .topic { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .ymq { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; }
      .coord { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; }
      .error { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .event { fill: none; stroke: #7e22ce; stroke-width: 2.2; marker-end: url(#arrow); }
      .queue { fill: none; stroke: #c2410c; stroke-width: 2.2; marker-end: url(#arrow); }
      .coord-flow { fill: none; stroke: #0f766e; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .error-flow { fill: none; stroke: #dc2626; stroke-width: 2.2; marker-end: url(#arrow); }
      .recovery { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .label-bg { fill: #ffffff; opacity: 0.96; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#f8fafc"/>
  <text class="txt title" x="50" y="58">Интеграционный событийный хаб</text>
  <text class="txt subtitle" x="50" y="88">Версионированные контракты, каноническое состояние, наблюдаемая at-least-once доставка</text>

  <rect class="boundary" x="540" y="135" width="730" height="660" rx="22"/>
  <text class="txt box-title" x="570" y="173">YDB boundary</text>
  <text class="txt small" x="730" y="173">Topics, row tables, transactions and CDC</text>

  <rect class="tx" x="575" y="365" width="660" height="270" rx="18"/>
  <text class="txt box-title" x="600" y="398">ACID-транзакция приема</text>
  <text class="txt small" x="600" y="421">Inbox + CanonicalState + DeliveryStatus + DispatchIntent</text>

  <path class="flow" d="M190 280 H230"/>
  <path class="event" d="M450 280 H570"/>
  <path class="event" d="M685 325 V350 H430 V390"/>
  <path class="flow" d="M820 265 H790 V350 H500 V390"/>
  <path class="flow" d="M540 480 H575"/>
  <path class="flow" d="M710 505 H730"/>
  <path class="flow" d="M880 505 H900"/>
  <path class="flow" d="M1030 505 H1050"/>
  <path class="event" d="M805 570 V650 H705 V670"/>
  <path class="event" d="M830 720 H840 V340 H1135 V325"/>
  <path class="event" d="M1130 570 V670"/>
  <path class="event" d="M1210 700 H1235 V340 H1190 V325"/>
  <path class="queue" d="M1210 740 H1275 V460 H1300"/>
  <path class="recovery" d="M1080 670 V635"/>
  <path class="event" d="M1240 265 H1370"/>
  <path class="queue" d="M1430 520 V550"/>
  <path class="flow" d="M1300 610 H1250 V650 H965 V570"/>
  <path class="error-flow" d="M300 550 H260 V725 H280"/>
  <path class="error-flow" d="M1210 755 H1390"/>
  <path class="coord-flow" d="M520 605 H575"/>

  <rect class="label-bg" x="452" y="248" width="118" height="22" rx="5"/>
  <text class="txt small" x="460" y="264">schema + version</text>
  <rect class="label-bg" x="455" y="326" width="115" height="22" rx="5"/>
  <text class="txt small" x="465" y="342">consumer group</text>
  <rect class="label-bg" x="850" y="326" width="210" height="22" rx="5"/>
  <text class="txt small" x="860" y="342">direct to Outgoing; no YMQ/DLQ</text>
  <rect class="label-bg" x="1215" y="716" width="65" height="22" rx="5"/>
  <text class="txt small" x="1225" y="732">enqueue</text>
  <rect class="label-bg" x="1275" y="238" width="60" height="22" rx="5"/>
  <text class="txt small" x="1285" y="254">pub/sub</text>
  <rect class="label-bg" x="1080" y="638" width="110" height="22" rx="5"/>
  <text class="txt small" x="1090" y="654">delivery result</text>

  <rect class="app" x="30" y="220" width="160" height="120" rx="14"/>
  <text class="txt box-title" x="60" y="255">Система A</text>
  <text class="txt body" x="60" y="282">источник</text>
  <text class="txt body" x="60" y="308">app API</text>

  <rect class="app" x="230" y="220" width="220" height="120" rx="14"/>
  <text class="txt box-title" x="260" y="255">API / Producer</text>
  <text class="txt body" x="260" y="282">SDK, Kafka API</text>
  <text class="txt body" x="260" y="308">service endpoint</text>

  <rect class="topic" x="570" y="205" width="230" height="120" rx="14"/>
  <text class="txt box-title" x="600" y="241">Incoming Topics</text>
  <text class="txt body" x="600" y="269">pub/sub входных событий</text>
  <text class="txt body" x="600" y="296">message_id, schema_version</text>

  <rect class="table" x="820" y="205" width="190" height="120" rx="14"/>
  <text class="txt box-title" x="845" y="235">SchemaRegistry</text>
  <text class="txt small" x="845" y="257">schema_id</text>
  <text class="txt small" x="845" y="275">schema_version</text>
  <text class="txt small" x="845" y="293">compatibility policy</text>
  <text class="txt small" x="845" y="313">state, versioned contract</text>

  <rect class="topic" x="1030" y="205" width="210" height="120" rx="14"/>
  <text class="txt box-title" x="1055" y="241">Outgoing Topics</text>
  <text class="txt body" x="1055" y="269">pub/sub events</text>
  <text class="txt body" x="1055" y="296">consumer groups</text>

  <rect class="app" x="280" y="390" width="260" height="160" rx="14"/>
  <text class="txt box-title" x="310" y="424">Validator /</text>
  <text class="txt box-title" x="310" y="448">Normalizer</text>
  <text class="txt body" x="310" y="478">schema validation</text>
  <text class="txt body" x="310" y="504">canonical contract</text>
  <text class="txt body" x="310" y="530">idempotent message_id</text>

  <rect class="coord" x="280" y="575" width="240" height="80" rx="12"/>
  <text class="txt box-title" x="310" y="607">Coordination</text>
  <text class="txt small" x="310" y="633">service coordination; not ACID</text>

  <rect class="error" x="280" y="680" width="240" height="90" rx="12"/>
  <text class="txt box-title" x="310" y="714">Quarantine</text>
  <text class="txt body" x="310" y="742">schema / validation error</text>

  <rect class="table" x="600" y="445" width="110" height="125" rx="12"/>
  <text class="txt box-title" x="625" y="478">Inbox</text>
  <text class="txt small" x="615" y="504">source_id,</text>
  <text class="txt small" x="615" y="526">message_id</text>
  <text class="txt small" x="615" y="548">schema_version</text>

  <rect class="table" x="730" y="445" width="150" height="125" rx="12"/>
  <text class="txt box-title" x="750" y="474">Canonical</text>
  <text class="txt box-title" x="750" y="496">State</text>
  <text class="txt small" x="750" y="518">entity_type,</text>
  <text class="txt small" x="750" y="538">entity_id, version</text>
  <text class="txt small" x="750" y="558">canonical payload</text>

  <rect class="table" x="900" y="445" width="130" height="125" rx="12"/>
  <text class="txt box-title" x="918" y="474">Delivery</text>
  <text class="txt box-title" x="918" y="496">Status</text>
  <text class="txt small" x="918" y="520">message_id,</text>
  <text class="txt small" x="918" y="542">destination_id</text>

  <rect class="table" x="1050" y="445" width="165" height="125" rx="12"/>
  <text class="txt body" x="1065" y="472" font-weight="700">DeliveryOutbox /</text>
  <text class="txt body" x="1065" y="492" font-weight="700">DispatchIntent</text>
  <text class="txt small" x="1065" y="514">message_id,</text>
  <text class="txt small" x="1065" y="534">destination_id, route</text>
  <text class="txt small" x="1065" y="554">stable id, pending</text>

  <rect class="topic" x="580" y="670" width="250" height="100" rx="14"/>
  <text class="txt box-title" x="605" y="702">CanonicalState CDC</text>
  <text class="txt small" x="605" y="727">exactly-once change record</text>
  <text class="txt small" x="605" y="749">read / processing may retry</text>

  <rect class="app" x="850" y="670" width="360" height="100" rx="14"/>
  <text class="txt box-title" x="875" y="701">DispatchIntent CDC / relay</text>
  <text class="txt small" x="875" y="725">exactly-once record; read may retry</text>
  <text class="txt small" x="875" y="747">idempotent publish/enqueue + recovery scan</text>

  <rect class="ymq" x="1300" y="400" width="260" height="120" rx="14"/>
  <text class="txt box-title" x="1325" y="435">YMQ — outside YDB</text>
  <text class="txt body" x="1325" y="463">SQS-compatible commands</text>
  <text class="txt body" x="1325" y="490">competing, at-least-once</text>

  <rect class="error" x="1390" y="690" width="170" height="80" rx="12"/>
  <text class="txt box-title" x="1420" y="722">Delivery DLQ</text>
  <text class="txt small" x="1420" y="748">retry limit reached</text>

  <rect class="app" x="1370" y="220" width="190" height="150" rx="14"/>
  <text class="txt box-title" x="1400" y="255">Система B</text>
  <text class="txt body" x="1400" y="282">Topic consumer</text>
  <text class="txt body" x="1400" y="308">Kafka API / SDK</text>
  <text class="txt body" x="1400" y="334">идемпотентно</text>

  <rect class="app" x="1300" y="550" width="260" height="120" rx="14"/>
  <text class="txt box-title" x="1330" y="583">Система C</text>
  <text class="txt body" x="1330" y="610">YMQ competing consumer</text>
  <text class="txt body" x="1330" y="636">idempotent service endpoint</text>

  <rect x="30" y="825" width="1530" height="130" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="txt box-title" x="55" y="859">Гарантии и границы интеграции</text>
  <text class="txt body" x="55" y="890">ACID: Inbox + CanonicalState + DeliveryStatus + DispatchIntent; no dual-write</text>
  <text class="txt body" x="55" y="918">CDC record is exactly-once; read/process may retry • CanonicalState CDC goes directly to Outgoing Topics</text>

  <rect class="app" x="1030" y="850" width="26" height="18" rx="3"/>
  <text class="txt small" x="1065" y="864">app</text>
  <rect class="table" x="1120" y="850" width="26" height="18" rx="3"/>
  <text class="txt small" x="1155" y="864">row table</text>
  <rect class="topic" x="1250" y="850" width="26" height="18" rx="3"/>
  <text class="txt small" x="1285" y="864">Topic / CDC</text>
  <rect class="ymq" x="1410" y="850" width="26" height="18" rx="3"/>
  <text class="txt small" x="1445" y="864">YMQ</text>
  <rect class="coord" x="1030" y="898" width="26" height="18" rx="3"/>
  <text class="txt small" x="1065" y="912">Coordination</text>
  <rect class="error" x="1225" y="898" width="26" height="18" rx="3"/>
  <text class="txt small" x="1260" y="912">Quarantine / DLQ</text>
</svg>
